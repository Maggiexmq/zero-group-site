pi:
  name: Giuseppe Belgioioso
  url: https://belgioio.github.io/
  role: Assistant Professor · Digital Futures Faculty · WASP Fellow
  image:
  bio: >
    From 2021 to 2024, he was first a Postdoc and then a Senior Scientist at the Automatic Control Laboratory (ifA), ETH Zurich.
    He received his PhD in automatic control from Eindhoven University of Technology in 2020, and his Bachelor's and Master's degrees from the University of Padova.

